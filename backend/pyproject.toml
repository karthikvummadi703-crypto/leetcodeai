[project]
name = "leetcode-guidance-backend"
version = "0.1.0"
description = "FastAPI backend for LeetCode Guidance AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "ISC", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in FastAPI route signatures is the framework's canonical
# dependency-injection pattern, not an accidental mutable default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# firebase-admin ships without type stubs.
module = ["firebase_admin"]
ignore_missing_imports = true

